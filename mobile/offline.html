<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Koneksi Terputus | SAP Al-Falah Putra</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            color: #0f172a;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: #ecfdf5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #059669;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 8px;
            color: #064e3b;
        }
        p {
            font-size: 0.875rem;
            color: #64748b;
            line-height: 1.5;
            margin: 0 0 24px;
        }
        button {
            background-color: #059669;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: #047857;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.829-6.364M3 3l18 18"></path>
            </svg>
        </div>
        <h1>Tidak Ada Koneksi Internet</h1>
        <p>Aplikasi sedang tidak terhubung ke jaringan internet. Silakan periksa koneksi Wi-Fi atau data seluler Anda lalu coba lagi.</p>
        <button onclick="window.location.reload()">Muat Ulang</button>
    </div>
</body>
</html>
