<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>SAP Al-Falah Putra</title>
    <meta name="theme-color" content="#064e3b">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        body {
            background-color: #064e3b;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            flex-direction: column;
            text-align: center;
        }
        .logo {
            width: 96px;
            height: 96px;
            border-radius: 20px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3.5px solid rgba(255, 255, 255, 0.25);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0 0 6px;
            letter-spacing: -0.01em;
        }
        p {
            font-size: 0.85rem;
            opacity: 0.85;
            margin: 0;
        }
    </style>
</head>
<body>
    <img src="images/icon-192x192.png" alt="Logo SAP" class="logo">
    <div class="spinner"></div>
    <h1>SAP Al-Falah Putra</h1>
    <p>Menghubungkan ke server pesantren...</p>

    <script>
        // Redirect ke live server pesantren saat online
        const targetUrl = "https://ponpesalfalahputak.my.id";
        if (navigator.onLine) {
            window.location.replace(targetUrl);
        } else {
            window.location.replace("offline.html");
        }
    </script>
</body>
</html>
